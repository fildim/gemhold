<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="58%" r="70%">
      <stop offset="0" stop-color="#4a2a1c"/>
      <stop offset="0.6" stop-color="#22160f"/>
      <stop offset="1" stop-color="#0e0907"/>
    </radialGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a7462"/>
      <stop offset="0.5" stop-color="#5c4a3d"/>
      <stop offset="1" stop-color="#2e241d"/>
    </linearGradient>
    <radialGradient id="mouth" cx="50%" cy="78%" r="65%">
      <stop offset="0" stop-color="#7a1426"/>
      <stop offset="0.45" stop-color="#2a070d"/>
      <stop offset="1" stop-color="#080404"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5a78" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5a78" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#b8801e"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- the lair: a rock hill with a cave mouth -->
  <path d="M58 470 L52 286 L120 170 L200 110 L262 88 L330 108 L402 168 L458 280 L452 470 Z"
        fill="url(#rock)" stroke="#1a120d" stroke-width="10" stroke-linejoin="round"/>
  <path d="M74 300 L128 186 L204 126 L262 104" fill="none" stroke="#b39b84" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <path d="M150 210 L190 236 M340 170 L372 214 M98 380 L130 400 M404 330 L428 372" stroke="#2e241d" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
  <path d="M136 470 V318 Q136 186 256 182 Q376 186 376 318 V470 Z" fill="url(#mouth)" stroke="#120b08" stroke-width="10"/>

  <!-- hoard glow and gold -->
  <circle cx="256" cy="330" r="150" fill="url(#glow)"/>
  <ellipse cx="256" cy="452" rx="128" ry="26" fill="#6b4a12"/>
  <ellipse cx="256" cy="444" rx="118" ry="20" fill="url(#gold)"/>
  <circle cx="178" cy="432" r="18" fill="url(#gold)" stroke="#7a5410" stroke-width="5"/>
  <circle cx="336" cy="436" r="16" fill="url(#gold)" stroke="#7a5410" stroke-width="5"/>
  <circle cx="306" cy="420" r="14" fill="url(#gold)" stroke="#7a5410" stroke-width="5"/>

  <!-- the gem -->
  <g stroke="#3d0816" stroke-width="8" stroke-linejoin="round">
    <path d="M146 290 L196 232 L232 290 Z" fill="#e33f60"/>
    <path d="M196 232 L316 232 L280 290 L232 290 Z" fill="#ff7590"/>
    <path d="M316 232 L366 290 L280 290 Z" fill="#b82445"/>
    <path d="M146 290 L232 290 L256 428 Z" fill="#c92d4d"/>
    <path d="M232 290 L280 290 L256 428 Z" fill="#f0587a"/>
    <path d="M280 290 L366 290 L256 428 Z" fill="#8c1531"/>
  </g>
  <path d="M206 244 L246 244 L232 270 L214 270 Z" fill="#ffd6df" opacity="0.9"/>
  <path d="M330 206 L338 226 L358 234 L338 242 L330 262 L322 242 L302 234 L322 226 Z" fill="#fff4e0"/>
</svg>
